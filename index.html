<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1020" />
    <title>Riftfall: Skybreak</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/ui.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hud-top">
        <div id="flow"><span class="label">FLOW</span> <span id="flow-mult">x1</span><div id="flow-bar"><i></i></div></div>
        <div id="biome"></div>
        <div id="right">
          <div id="energy"><span class="label">COINS</span> <span id="energy-val">0</span></div>
          <div id="timer">0:00.0</div>
          <button id="btn-pause" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div id="rift"><span class="label">RIFT</span> <span id="rift-val">--</span></div>
      <div id="hint">REACH THE RIFT</div>
    </div>
    <div id="prompt" hidden>E · GRAPPLE</div>
    <div id="toast"></div>
    <div id="version"></div>

    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="stick" class="idle"><div id="stick-knob"></div></div>
      <div id="buttons">
        <button id="btn-grapple" class="touch-btn" aria-label="Grapple">GRAPPLE</button>
        <button id="btn-jump" class="touch-btn big" aria-label="Jump">JUMP</button>
        <button id="btn-dash" class="touch-btn" aria-label="Dash">DASH</button>
        <button id="btn-slide" class="touch-btn small" aria-label="Slide">SLIDE</button>
      </div>
    </div>

    <div id="overlay">
      <div id="ov-panel">
        <h1 id="ov-title">RIFTFALL</h1>
        <p id="ov-sub">SKYBREAK</p>
        <div id="ov-cards"></div>
        <p id="ov-foot">LOADING</p>
      </div>
    </div>

    <pre id="debug" hidden></pre>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
